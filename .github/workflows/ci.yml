name: CI Test & Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB_NAME: medishare_test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      REFRESH_SECRET: ci-test-refresh-secret-at-least-32-characters-long
      KEY_ENCRYPTION_KEY: ci-test-kek-encryption-key-32-chars-long

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npx tsc -b --noEmit

      - name: Setup Database Indexes & Seed Demo Records
        run: |
          node scripts/setup-indexes.js
          node scripts/seed.js

      - name: Run Automated Test Suites (Vitest)
        run: npm test

      - name: Verify Production Bundler Build
        run: npm run build
